name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    # Intentionally not restricted to `branches: [main]` — PRs targeting a
    # long-lived feature branch (e.g. a refactor landing in stages) should
    # still get full CI validation before merge.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # node24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # node24
        with:
          # Pinned to a specific minor (not go-version-file: go.mod, which
          # would resolve to go.mod's conservative `go 1.21` floor): recent
          # govulncheck releases require go>=1.26, and an old exact patch
          # (e.g. 1.26.1) accumulates known, already-fixed stdlib CVEs that
          # would otherwise make the govulncheck step below fail forever.
          # check-latest keeps picking up the newest 1.26.x security patch.
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@80a417e6155c5cdf37eb2391cf7785a64fbb9ae0 # node24

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # node24
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # node24
        with:
          go-version: "1.26"
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./... -v -count=1
      - name: Unit test coverage
        run: go test ./internal/... -coverprofile=coverage.txt -covermode=atomic -count=1
      - name: Check coverage threshold
        run: ./scripts/check-coverage.sh coverage.txt
      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.txt
      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Integration tests
        run: go test ./tests/integration/... -tags integration -v -timeout 5m -count=1

  windows:
    name: Windows build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # node24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # node24
        with:
          go-version: "1.26"
          check-latest: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # Windows-only files (internal/task/driver_windows.go,
      # cmd/devx/cmd_down_windows.go, etc.) are otherwise never compiled or
      # exercised by CI at all, since every other job runs on ubuntu-latest.
      # No integration-test/coverage-gate step here: those assume a Docker
      # daemon and a bash-based check-coverage.sh, neither guaranteed on
      # windows-latest runners — build+vet is the hard gate for catching a
      # GOOS=windows compile regression.
      - name: Unit tests
        run: go test ./... -v -count=1

  goreleaser-check:
    name: Validate goreleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # node24
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # node24
        with:
          go-version-file: go.mod
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          install-only: true
      - name: goreleaser check
        run: goreleaser check
      # Snapshot mode builds every platform target and runs most of the
      # pipeline (archives, checksums) without publishing anything, without
      # needing a real tag — catches config regressions (bad templates,
      # broken build matrix entries, deprecated fields) on every PR instead
      # of only on a real tagged release. Note: goreleaser always skips the
      # homebrew_casks pipe in --snapshot mode regardless of --skip flags,
      # so this intentionally does not cover Homebrew-cask-specific config.
      - name: goreleaser release --snapshot
        run: goreleaser release --snapshot --clean --skip=publish
