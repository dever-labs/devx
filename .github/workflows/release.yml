name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Build release binaries with a current, patched Go toolchain --
          # go.mod's `go 1.21` directive is a conservative compatibility
          # floor, not a build target; go-version-file would resolve to an
          # EOL, unpatched 1.21.x. See .github/workflows/ci.yml for the
          # same reasoning applied to the lint/test/windows jobs.
          go-version: "1.26"
          check-latest: true

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          install-only: true

      # release-please (.github/workflows/release-please.yml) already
      # created the git tag + GitHub Release (with changelog body) for this
      # event; goreleaser's release.mode: keep-existing (.goreleaser.yaml)
      # preserves that body and only builds/attaches binaries + checksums,
      # then pushes the updated Homebrew formula to dever-labs/homebrew-tap.
      - name: Run goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: goreleaser release --clean
