name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          install-only: true

      # release-please (.github/workflows/release-please.yml) already
      # created the git tag + GitHub Release (with changelog body) for this
      # event; goreleaser's release.mode: keep-existing (.goreleaser.yaml)
      # preserves that body and only builds/attaches binaries + checksums,
      # then pushes the updated Homebrew formula to dever-labs/homebrew-tap.
      - name: Run goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: goreleaser release --clean
