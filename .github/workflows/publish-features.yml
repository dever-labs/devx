name: Publish devcontainer Features

# Packages everything under features/src and publishes each Feature as an OCI
# artifact to ghcr.io/dever-labs/devx/<feature-id> (see
# https://containers.dev/implementors/features-distribution/). Also opens a PR
# with auto-generated Feature docs.
on:
  push:
    branches: [main]
    paths:
      - "features/src/**"
      - ".github/workflows/publish-features.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Features
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # node24

      - name: Publish Features
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./features/src"
          generate-docs: "true"
