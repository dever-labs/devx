name: Publish devcontainer Features

# Packages everything under features/src and publishes each Feature as an OCI
# artifact to ghcr.io/dever-labs/devx/<feature-id> (see
# https://containers.dev/implementors/features-distribution/). Also opens a PR
# with auto-generated Feature docs.
#
# No features-namespace override: the devcontainers/action default (full repo
# path, "dever-labs/devx") is used as-is. Each Feature's id is kept distinct
# from the repo name (e.g. "cli", not "devx") specifically to avoid the
# confusing, duplicated ghcr.io/dever-labs/devx/devx path that would result
# if a Feature's id matched the repo name. This also keeps the CLI's
# auto-generated devcontainer-collection.json push (always targets
# <registry>/<namespace>, no id suffix -- here ghcr.io/dever-labs/devx)
# meaningful instead of a generic, orphan-prone "features" package.
on:
  push:
    branches: [main]
    paths:
      - "features/src/**"
      - ".github/workflows/publish-features.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Features
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # node24

      # devcontainers/action does not authenticate to GHCR itself; without this the push
      # fails with "403: Failed to fetch bearer token for 'ghcr.io'". The per-run
      # GITHUB_TOKEN (packages: write above) is all that is needed; no stored secret.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Features
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./features/src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
