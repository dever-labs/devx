name: Publish devcontainer Features

# Packages everything under features/src and publishes each Feature as an OCI
# artifact to ghcr.io/dever-labs/<feature-id> (see
# https://containers.dev/implementors/features-distribution/). Also opens a PR
# with auto-generated Feature docs.
on:
  push:
    branches: [main]
    paths:
      - "features/src/**"
      - ".github/workflows/publish-features.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Features
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # node24

      # devcontainers/action does not authenticate to GHCR itself; without this the push
      # fails with "403: Failed to fetch bearer token for 'ghcr.io'". The per-run
      # GITHUB_TOKEN (packages: write above) is all that is needed; no stored secret.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishing as ghcr.io/dever-labs/devx (single segment) is what we want, but the
      # devcontainers CLI then also tries to push collection metadata to ghcr.io/dever-labs
      # which GHCR rejects (NAME_INVALID). The Feature itself is pushed first, so that
      # error is tolerated and the next step verifies the Feature really is published.
      - name: Publish Features
        continue-on-error: true
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./features/src"
          features-namespace: "dever-labs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published Feature
        run: |
          v=$(jq -r .version features/src/devx/devcontainer-feature.json)
          docker buildx imagetools inspect "ghcr.io/dever-labs/devx:${v}" > /dev/null
