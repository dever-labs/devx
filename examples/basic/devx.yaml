version: 1

project:
  name: my-app

vars:
  DB_PASSWORD: postgres
  DB_PORT: "5432"
  API_PORT: "8080"

# ── Database, built from an official image ──────────────────────────────────
db:
  desc: Postgres for local dev
  run: >-
    docker run --rm -d --name my-app-db
    -p ${DB_PORT}:5432
    -e POSTGRES_PASSWORD=${DB_PASSWORD}
    -e POSTGRES_DB=appdb
    -v my-app-db-data:/var/lib/postgresql/data
    postgres:16
  ready:
    tcp: localhost:${DB_PORT}

# ── Cache ────────────────────────────────────────────────────────────────────
cache:
  desc: Redis for local dev
  run: docker run --rm -d --name my-app-cache -p 6379:6379 redis:7

# ── One-shot DB migration, gated on the db being ready ──────────────────────
migrate:
  desc: Apply database migrations
  deps: [db]
  run: echo "no migrations yet — add your migration tool's command here"

# ── API, built from source ──────────────────────────────────────────────────
api:
  desc: API server (built from ./src/api)
  deps: [migrate, cache]
  dir: ./src/api
  run: >-
    docker build -t my-app-api . &&
    docker run --rm -d --name my-app-api
    -p ${API_PORT}:80
    -e APP_ENV=development
    -e DB_HOST=host.docker.internal
    -e DB_PORT=${DB_PORT}
    -e DB_NAME=appdb
    -e DB_USER=postgres
    -e DB_PASSWORD=$DB_PASSWORD
    my-app-api
  env:
    DB_PASSWORD: ${DB_PASSWORD}
  ready:
    http: http://localhost:${API_PORT}/

# ── Worker, built from source, no exposed port ──────────────────────────────
worker:
  desc: Background worker (built from ./src/worker)
  deps: [migrate, cache]
  dir: ./src/worker
  run: >-
    docker build -t my-app-worker . &&
    docker run --rm -d --name my-app-worker
    -e APP_ENV=development
    -e DB_HOST=host.docker.internal
    -e DB_PASSWORD=$DB_PASSWORD
    my-app-worker
  env:
    DB_PASSWORD: ${DB_PASSWORD}
  detached: true
  ready:
    cmd: docker inspect -f '{{.State.Running}}' my-app-worker

# ── Everyday dev tasks ───────────────────────────────────────────────────────
build:
  desc: Build the API and worker images without starting them
  run: |
    docker build -t my-app-api ./src/api
    docker build -t my-app-worker ./src/worker

test:
  desc: Run the project's test suite
  run: echo "add your test command here"
