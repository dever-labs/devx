# yaml-language-server: $schema=https://raw.githubusercontent.com/dever-labs/devx/main/schemas/devx.schema.json
version: 1

project:
  name: devx

tools:
  - name: go
    version: "1.21"
    check: "go version"
    install:
      windows: "winget install GoLang.Go"
      macos: "brew install go"
      linux: "sudo apt-get install -y golang-go"

  - name: golangci-lint
    check: "golangci-lint version"
    install:
      windows: "winget install golangci-lint"
      macos: "brew install golangci-lint"
      linux: "curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin"

build:
  desc: Build the devx binary
  run: go build ./cmd/devx

vet:
  desc: Run go vet across all packages
  run: go vet ./...

lint:
  desc: Run golangci-lint
  run: golangci-lint run ./...

test:
  desc: Run unit tests with the race detector
  deps: [vet]
  run: go test ./... -race

integration:
  desc: Run the Docker-backed integration suite (requires Docker)
  deps: [build]
  run: >-
    DEVX_BIN=$(pwd)/devx
    go test ./tests/integration/... -tags integration -timeout 180s

all:
  desc: Everything CI runs — build, vet, lint, and race tests
  deps: [build, vet, lint, test]
  run: echo "all checks passed"
